<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const KW='let|rec|in|if|then|else|match|with|function|fun|and|type|of|when|begin|end|for|to|downto|do|done|while|try|raise|exception|assert|mutable|open';
const RX=new RegExp('(\\(\\*[\\s\\S]*?\\*\\))|\\b('+KW+')\\b','g');
const c=s=>'<pre>'+esc(s.trim()).replace(RX,(m,a,b)=>a?'<i class="c">'+a+'</i>':'<b class="k">'+b+'</b>')+'</pre>';
const box=(t,h,x)=>`<div class="box b${t}"><b>${h}</b>${x}</div>`;
const T=[
['1 · Variables',[
['Premiers pas',`<p>L'interpréteur interactif (<em>toplevel</em>) lit une expression, l'évalue et affiche le résultat. Les caractères <code>;;</code> terminent l'expression. Chaque expression est d'abord <b>typée</b>, puis évaluée.</p>${c(`1 + 2 * 3;;
- : int = 7`)}${box('n','Le système de typage',`<ul><li><b>Typage fort</b> : une expression mal typée ne peut pas être évaluée.</li><li><b>Typage statique</b> : les types sont vérifiés <u>avant</u> l'exécution.</li><li><b>Inférence automatique</b> : OCaml calcule seul le type des expressions.</li></ul>`)}`],
['Déclarer une variable',`<p>Une <b>déclaration</b> lie un identifiant à la valeur d'une expression : <code>let &lt;identifiant&gt; = &lt;expression&gt;</code>. L'expression de droite est évaluée, puis liée à l'identifiant. Le nom est alphanumérique, ne commence pas par une majuscule et n'est pas un mot-clé.</p>${c(`let s = 1 + 2 + 3;;
val s : int = 6
let somme_carre = s * s;;
val somme_carre : int = 36
let s = 4;;
val s : int = 4
s;;
- : int = 4
somme_carre;;
- : int = 36   (* inchangé : immuabilité *)`)}${box('w','Immuabilité',`<p>Une fois liée, la valeur d'une variable ne peut plus être modifiée. Une nouvelle liaison <b>masque</b> la précédente sans la remplacer. Pas de compteur ni de boucle <code>for</code>/<code>while</code> « classique » a priori : il faut repenser sa façon de programmer.</p>`)}`],
['1.1 Portée',`<p>La <b>portée</b> d'une liaison est le contexte où l'on peut accéder à la valeur liée : <b>globale</b> si la valeur est accessible dans tout le programme, <b>locale</b> sinon. On limite la portée avec <code>in</code> : <code>let x = e1 in e2</code> évalue <code>e1</code>, lie <code>x</code>, puis évalue <code>e2</code> avec cette liaison.</p>${c(`let x = 1;;                (* liaison globale *)
let y = x + 2 in           (* liaison locale *)
  let x = y + 1 in         (* masque la première *)
  x;;
- : int = 4
x;;
- : int = 1
y;;
Error: Unbound value y`)}`],
['1.2 Opérations sur les nombres',`<p>Entiers (<code>int</code>) : <code>+ - * /</code> (division entière) et <code>mod</code>. Flottants (<code>float</code>) : notation avec un point, opérateurs <code>+. -. *. /.</code> et <code>**</code>. On ne mélange <b>jamais</b> <code>int</code> et <code>float</code>.</p>${c(`9 / 2;;  - : int = 4
9 mod 2;;  - : int = 1
3.5 +. 2.;;  - : float = 5.5
3.1415 / 2;;
Error: This expression has type float but an expression was expected of type int`)}${box('n','Dépassement de capacité et flottants',`<p>Les <code>int</code> et <code>float</code> ont une représentation finie. Sur une machine 64 bits : <code>max_int = 4611686018427387903</code> (2<sup>62</sup>−1) et <code>max_int + 1</code> vaut <code>min_int</code>. Les flottants sont approchés : ne jamais tester leur égalité avec <code>=</code>.</p>${c(`0.1 +. 0.2 = 0.3;;
- : bool = false
abs_float (0.1 +. 0.2 -. 0.3) <= 1e-15;;
- : bool = true`)}<p>Le problème vient de la machine, pas d'OCaml (même chose en Python ou en C).</p>`)}`],
['1.3 Chaînes de caractères',`<p>Le type <code>string</code> : guillemets doubles. Opérations : concaténation <code>^</code>, longueur <code>String.length</code>, accès au i-ème caractère <code>s.[i]</code> (à partir de 0). Le type <code>char</code> : un caractère entre guillemets simples (<code>'v'</code>, <code>'\n'</code>, <code>'\t'</code>). Les chaînes sont <b>immuables</b>.</p>${c(`let chaine = "Bon" ^ "jour " ^ "!";;
val chaine : string = "Bonjour !"
String.length chaine;;  - : int = 9
chaine.[1];;  - : char = 'o'`)}`],
['1.4 Opérateurs booléens',`<p>Type <code>bool</code> : <code>true</code>, <code>false</code>. Égalité logique <code>=</code> (contenu), égalité physique <code>==</code> (adresse mémoire) ; inégalité <code>&lt;&gt;</code>, <code>&lt; &lt;= &gt; &gt;=</code> ; logique : <code>not</code>, <code>&amp;&amp;</code>, <code>||</code>. Les codes ASCII : <code>Char.code</code>.</p>${box('n','Opérateurs paresseux',`<p><code>&amp;&amp;</code> et <code>||</code> évaluent d'abord l'expression de gauche ; celle de droite n'est évaluée que si c'est nécessaire.</p>${c(`true && (1/0 = 1);;
Exception: Division_by_zero.
false && (1/0 = 1);;
- : bool = false`)}`)}${box('n','Priorité et associativité',`<p><code>=</code> est prioritaire sur <code>&amp;&amp;</code>, qui est prioritaire sur <code>||</code>. Les opérateurs <code>&amp;&amp;</code> et <code>||</code> sont associatifs à droite, <code>+</code> à gauche.</p>`)}`]
]],
['2 · Fonctions',[
['2.1 Fonctions de conversion',`<p>Pas de conversion implicite : <code>type2_of_type1</code> convertit une valeur de <code>type1</code> en <code>type2</code>. Les fonctions sont des valeurs : leur <b>signature</b> s'affiche avec <code>-&gt;</code>.</p>${c(`float_of_int;;
- : int -> float = <fun>
2. ** (float_of_int 3);;
- : float = 8.`)}<table><tr><th>Fonction</th><th>Signature</th><th>Rôle</th></tr><tr><td><code>float_of_int</code></td><td>int -&gt; float</td><td>injection naturelle</td></tr><tr><td><code>int_of_float</code></td><td>float -&gt; int</td><td>partie entière (troncature)</td></tr><tr><td><code>int_of_char</code></td><td>char -&gt; int</td><td>code ASCII</td></tr><tr><td><code>char_of_int</code></td><td>int -&gt; char</td><td>caractère de ce code</td></tr><tr><td><code>int_of_string</code></td><td>string -&gt; int</td><td>entier encodé par la chaîne</td></tr><tr><td><code>string_of_int</code></td><td>int -&gt; string</td><td>chaîne de l'entier</td></tr></table>${box('w','Parenthèses',`<p>Jamais autour de l'argument, mais autour de tout l'<b>appel</b> de fonction : <code>f (g x)</code>, pas <code>f(g) x</code>.</p>`)}`],
['2.2 Fonctions d\'affichage',`<p>Une fonction à <b>effet de bord</b> modifie l'état global du programme (affichage…). <code>print_int</code>, <code>print_float</code>, <code>print_string</code>, <code>print_endline</code> (avec saut de ligne), <code>print_newline : unit -&gt; unit</code>. Elles renvoient <code>unit</code>, dont l'unique valeur est <code>()</code> : ce sont des <b>procédures</b>. On les enchaîne avec <code>;</code>. Lecture : <code>read_int : unit -&gt; int</code>.</p>${c(`print_int 1; print_int 0; print_endline "2";;
102
- : unit = ()
let () = let input = read_int () in print_int (input + 2);;`)}<p><code>print_newline</code> est la fonction ; <code>print_newline ()</code> est son appel. Un programme complet est une succession de déclarations.</p>`],
['2.3 Déclarer une fonction',`<p><code>let &lt;id&gt; &lt;arg_1&gt; ... &lt;arg_n&gt; = &lt;expression&gt;</code>. La valeur renvoyée est la <b>dernière expression évaluée</b> : pas de <code>return</code>. L'application se fait par juxtaposition.</p>${c(`let carre x = x * x;;
val carre : int -> int = <fun>
let f x y z = y + z - x;;
val f : int -> int -> int -> int = <fun>
f 1 2 3;;
- : int = 4`)}${box('n','Stratégie d\'évaluation',`<p>OCaml procède par défaut par <b>passage par valeur</b> (arguments évalués d'abord), sauf pour <code>&amp;&amp;</code> et <code>||</code> (évaluation <b>paresseuse</b>).</p>`)}`],
['2.4 Fonctions locales',`<p>Utiles pour les fonctions auxiliaires qui ne servent qu'à une seule fonction.</p>${c(`let triplet_pythagoricien x y z =
  let carre n = n * n
  in carre x + carre y = carre z;;
triplet_pythagoricien 3 4 5;;
- : bool = true
carre 5;;
Error: Unbound value carre`)}`],
['2.5 Structures conditionnelles',`<p><code>if &lt;e1&gt; then &lt;e2&gt; else &lt;e3&gt;</code> : <code>e1</code> est un <code>bool</code>, et <code>e2</code>, <code>e3</code> ont le même type (celui du <code>if</code>). Sans <code>else</code>, <code>e2</code> doit être de type <code>unit</code>.</p>${c(`let resultat = if true && false then 1. else 8.;;
val resultat : float = 8.`)}<p><b>Problème du « dangling else »</b> : avec des <code>if</code> imbriqués, utiliser <code>begin ... end</code> (ou des parenthèses) pour lever l'ambiguïté.</p>${c(`let is_equal a b =
  if a = b then print_endline "Equal"
  else begin
    print_string "Not Equal: ";
    print_int a; print_string " and "; print_int b;
    print_newline ()
  end;;
val is_equal : int -> int -> unit = <fun>`)}`],
['2.6 Polymorphisme paramétrique',`<p>Quand rien ne contraint un type, OCaml utilise des variables de type <code>'a</code>, <code>'b</code>… : n'importe quel type convient. Un même nom désigne un même type.</p>${c(`(=);;
- : 'a -> 'a -> bool = <fun>
let if_then_else b x y = if b then x else y;;
val if_then_else : bool -> 'a -> 'a -> 'a = <fun>
let first x y = x;;
val first : 'a -> 'b -> 'a = <fun>
let second x y = y;;
val second : 'a -> 'b -> 'b = <fun>`)}`],
['2.7 Ordre supérieur et fonctions anonymes',`<p>Les fonctions sont des <b>citoyens de première classe</b> : on peut les lier, les renvoyer ou les passer en argument. Une fonction qui prend ou renvoie une fonction est dite d'<b>ordre supérieur</b>. Les signatures correspondantes contiennent des parenthèses.</p>${c(`let evalue_en_0 f = f 0;;
val evalue_en_0 : (int -> 'a) -> 'a = <fun>
let h x y = ('A' < x) && (y x);;
val h : char -> (char -> bool) -> bool = <fun>`)}${box('n','Curryfication',`<p><code>-&gt;</code> est associatif à droite : <code>(+) : int -&gt; (int -&gt; int)</code>. Une fonction à plusieurs paramètres est en fait une fonction à un paramètre qui renvoie une fonction, d'où l'<b>application partielle</b>.</p>${c(`let plus x y = x + y;;
let ajoute3 = plus 3;;
val ajoute3 : int -> int = <fun>
ajoute3 22;;
- : int = 25`)}`)}<p>Une fonction est <b>anonyme</b> si elle n'est liée à aucun identifiant (mot-clé <code>fun</code>). Équivalent Python : <code>lambda</code>.</p>${c(`(fun x -> x + 1) 3;;
- : int = 4
fun x y -> x*x + y*y;;      (* = fun x -> fun y -> ... *)
- : int -> int -> int = <fun>
let apply f x = f x;;
val apply : ('a -> 'b) -> 'a -> 'b = <fun>
let compose g f = fun x -> g (f x);;
val compose : ('a -> 'b) -> ('c -> 'a) -> 'c -> 'b = <fun>
compose (fun x -> x*x) (fun x -> x+2) 2;;
- : int = 16`)}`],
['2.8 Programmation purement fonctionnelle',`<p>Fonctions de première classe et ordre supérieur caractérisent les langages <b>fonctionnels</b> : on compose des fonctions comme en mathématiques, en se concentrant sur le résultat voulu plutôt que sur la façon de le construire (<b>modularité</b>). Structure typique : déclarations de fonctions globales, puis <code>let () = ...</code> comme point d'entrée.</p>${box('n','Pureté',`<p>Une expression est <b>pure</b> si l'évaluer plusieurs fois ne modifie pas sa valeur de retour. Une expression pure sans effet de bord peut être remplacée par sa valeur : c'est la <b>transparence référentielle</b>, qui simplifie les preuves sur les programmes.</p>`)}`]
]],
['3 · Récursivité',[
['3.1 Fonctions récursives',`<p>Puisque les variables sont immuables, on remplace les boucles par la récursivité. Une fonction est <b>récursive</b> si sa déclaration contient un appel à elle-même, et doit avoir au moins un <b>cas de base</b> (qui termine) et un <b>cas récursif</b> (sur des arguments plus petits). En OCaml : <code>let rec</code>.</p>${c(`let rec factorielle n =
  if n = 0 then 1                      (* cas de base *)
  else n * factorielle (n-1);;         (* cas récursif *)
val factorielle : int -> int = <fun>`)}${box('t','Écrire une fonction récursive',`<p>1) Cas de base : valeur directe. 2) Cas récursif : identifier ce que renvoie l'appel sur un argument plus petit, puis en déduire le résultat voulu. 3) Vérifier que tout appel finit par atteindre un cas de base (<b>terminaison</b>).</p>`)}`+`${c(`(* applique n fois f *)
let rec applique_n f n =
  if n = 0 then (fun x -> x)
  else (fun x -> f (applique_n f (n-1) x));;

(* x^n par exponentiation rapide *)
let rec puissance x n =
  if n = 0 then 1
  else let v = puissance x (n/2) in
       if n mod 2 = 0 then v * v else x * v * v;;

(* n est-il une puissance de 2 ? *)
let rec est_puissance2 n =
  if n = 0 then false
  else if n = 1 then true
  else if n mod 2 = 1 then false
  else est_puissance2 (n/2);;`)}`],
['3.2 Arbre des appels récursifs',`<p>Exemple : Fibonacci, avec <code>u₀ = u₁ = 1</code> et <code>uₙ = uₙ₋₁ + uₙ₋₂</code> pour <code>n ≥ 2</code>. L'arbre des appels de <code>fibo 4</code> montre que les mêmes calculs sont refaits plusieurs fois : le coût est exponentiel.</p>${c(`let rec fibo n =
  if n = 0 || n = 1 then 1
  else fibo (n-1) + fibo (n-2);;`)}`],
['3.3 Filtrage',`<p>Le <b>filtrage par motif</b> compare une valeur à une suite de motifs <code>| &lt;motif&gt; -&gt; &lt;expr&gt;</code>, dans l'ordre ; la première correspondance est évaluée. Le motif universel <code>_</code> accepte tout sans lier de nom. <code>function</code> filtre implicitement le dernier argument. Une garde <code>when</code> ajoute une condition ; <code>0 | 1</code> combine deux motifs.</p>${c(`let rec factorielle n = match n with
  | 0 -> 1
  | _ -> n * factorielle (n-1);;

let rec factorielle = function
  | 0 | 1 -> 1
  | n when n > 0 -> n * factorielle (n-1)
  | _ -> -1;;`)}${box('w','Bonnes pratiques',`<p>OCaml avertit (« not exhaustive ») si un filtrage peut échouer à l'exécution : terminer par le motif universel. Tous les motifs ont le type de l'expression filtrée, et toutes les branches ont le même type.</p>`)}`],
['3.4 Récursivité croisée',`<p>Des définitions sont <b>mutuellement récursives</b> si chacune dépend de l'autre. Le mot-clé <code>and</code> les regroupe en une seule déclaration (avec <code>let rec</code>). Exemple : <code>u₀ = v₀ = 1</code>, <code>uₙ = 2uₙ₋₁ + vₙ₋₁ + 4</code>, <code>vₙ = uₙ₋₁ − vₙ₋₁ + 3</code>.</p>${c(`let rec u n = match n with
  | 0 -> 1
  | _ -> 2 * u (n-1) + v (n-1) + 4
and v n = match n with
  | 0 -> 1
  | _ -> u (n-1) - v (n-1) + 3;;
val u : int -> int = <fun>
val v : int -> int = <fun>`)}<p><code>and</code> sert aussi à des liaisons simultanées : <code>let x = 1 and y = 2 in ...</code></p>`],
['3.5 Une structure de données récursive : les listes chaînées',`<p>Une liste est soit vide (<code>[]</code>), soit un élément de tête <code>t</code> suivi d'une queue <code>q</code> : <code>t::q</code>. Le type <code>'a list</code> est <b>homogène</b>. <code>[1;5;10]</code> est un raccourci pour <code>1::5::10::[]</code>. Les listes sont immuables : toute fonction renvoyant une liste en crée une nouvelle. On les manipule par fonctions récursives et filtrage : cas <code>[]</code> (base) et cas <code>t::q</code> (récursif).</p>${c(`let l1 = [1; 5; 10; 7];;
let l2 = 3::l1;;     val l2 : int list = [3; 1; 5; 10; 7]
let l3 = 'c'::l1;;
Error: This expression has type int list but an expression was expected of type char list
let l4 = l1::l2::[];;  (* int list list *)

(* motifs : [] vide ; t::q non vide ; [x] ; x::y::[] ou [x;y] ; x::y::_ ≥ 2 éléments *)
let rec longueur l = match l with
  | [] -> 0
  | t::q -> 1 + longueur q;;

let rec filtre_pairs l = match l with
  | [] -> []
  | t::q when t mod 2 = 0 -> t :: filtre_pairs q
  | _::q -> filtre_pairs q;;

let rec concatene l1 l2 = match l1 with
  | [] -> l2
  | t::q -> t :: concatene q l2;;

let rec nb_occurrences l elem = match l with
  | [] -> 0
  | t::q when t = elem -> 1 + nb_occurrences q elem
  | _::q -> nb_occurrences q elem;;

let rec miroir l = match l with
  | [] -> []
  | t::q -> (miroir q) @ [t];;`)}${box('n','Coût de miroir',`<p>Il y a n appels à <code>@</code>, dont la liste de gauche (<code>miroir q</code>) a pour longueur 0, 1, …, n−1 : coût exact Σᵢ i = n(n−1)/2, donc <b>quadratique</b>. Rappel : <code>(@) : 'a list -&gt; 'a list -&gt; 'a list</code> et <code>(::) : 'a -&gt; 'a list -&gt; 'a list</code>.</p>`)}`],
['3.6 Pour aller plus loin : la récursivité terminale',`<p>La récursivité coûte de l'espace dans la pile d'appels (proportionnel à la taille de la liste pour <code>longueur</code>). Un appel est <b>terminal</b> s'il est la dernière expression évaluée du corps ; une fonction est <b>récursive terminale</b> si tous ses appels récursifs le sont : OCaml l'optimise et ne consomme alors plus de pile. On ajoute un <b>accumulateur</b> via une fonction auxiliaire.</p>${c(`let longueur l =
  let rec longueur_avec_acc liste acc =   (* longueur de liste + acc *)
    match liste with
    | [] -> acc
    | _::q -> longueur_avec_acc q (acc + 1)
  in longueur_avec_acc l 0;;

let miroir l =                             (* complexité linéaire *)
  let rec aux l acc = match l with
    | [] -> acc
    | t::q -> aux q (t::acc)
  in aux l [];;`)}<p><code>List.length</code> est récursive terminale ; <code>List.concat</code> (et <code>@</code>) ne l'est pas.</p>`]

['4 · Nouveaux types',[
['4.1 Tuples',`<p>Un type <b>produit</b> regroupe des valeurs de types différents (<b>n-uplets</b>). Éléments séparés par des virgules, type formé avec des étoiles <code>*</code> ; les parenthèses sont facultatives. On déconstruit avec un <code>let</code> ou un filtrage.</p>${c(`let tuple = (1, ("ha", 3.14), true);;
val tuple : int * (string * float) * bool = ...
let (x, (_, z), _) = (1, (true, "hello"), 3.4);;   (* x : int, z : float *)
let second tuple = match tuple with | _,y -> y;;
val second : 'a * 'b -> 'b = <fun>`)}`],
['4.2 Enregistrement',`<p>Un type <b>structuré</b> est un ensemble de champs nommés et typés. Champs immuables par défaut ; <code>mutable</code> les rend modifiables, avec <code>&lt;-</code>.</p>${c(`type point = { x : int; y : int };;

p2.color;;  - : string = "Bleu"

Error: The record field x is not mutable`)}`],
['4.3 Type somme',`<p>Un type <b>somme</b> est défini par un choix fini de <b>constructeurs</b>, toujours commençant par une majuscule. Le filtrage s'y applique naturellement. Un constructeur peut porter une valeur : <code>Constructeur of type</code>.</p>${c(`type notes = Do | Re | Mi | Fa | Sol | La | Si;;
type int_liste = Vide | Cons of int * int_liste;;
let rec longueur l = match l with
  | Vide -> 0
  | Cons (_, q) -> 1 + longueur q;;

type resultat = OK of int | Erreur;;
let division x y = match y with
  | 0. -> Erreur
  | _ -> OK (x /. y);;`)}${box('n',`Le type 'a option`,`<p>Déjà fourni : <code>type 'a option = Some of 'a | None</code>.</p>${c(`let extrait x = match x with
  | None -> -1
  | Some n -> n;;`)}`)}<p>Exemple : expressions arithmétiques.</p>${c(`type expr = Zero | Entier of int | Plus of expr * expr | Mult of expr * expr;;
let e = Mult (Plus (Entier 1, Entier 2), Plus (Entier 3, Zero));;   (* (1+2)*(3+0) *)
let rec evalue = function
  | Zero -> 0
  | Entier n -> n
  | Plus (e1, e2) -> evalue e1 + evalue e2
  | Mult (e1, e2) -> evalue e1 * evalue e2;;`)}`],
['4.4 Exceptions',`<p>On déclare ses exceptions avec <code>exception</code> (constructeur à majuscule, éventuellement porteur d'une valeur) et on les lève avec <code>raise</code>. Une exception peut être <b>rattrapée</b> avec <code>try ... with</code> : le programme reprend alors un flot normal.</p>${c(`exception Liste_vide;;
let tete l = match l with
  | [] -> raise Liste_vide
  | t::_ -> t;;

let dernier l = (* variante avec exception prédéfinie *)
  let rec aux = function
    | [] -> raise (Failure "Liste vide")
    | [x] -> x
    | _::q -> aux q
  in aux l;;

try tete [] with Liste_vide -> -1;;
- : int = -1`)}${box('n','Les assertions',`<p><code>assert &lt;expr&gt;</code> renvoie <code>()</code> si l'expression vaut <code>true</code>, et lève <code>Assert_failure</code> sinon. Elles vérifient des conditions à un moment précis ; on ne les rattrape pas en général.</p>${c(`let rec factorielle n = assert (n >= 0);
  match n with
  | 0 -> 1
  | _ -> n * factorielle (n-1);;`)}`)}`]

['5 · Aspects impératifs',[
['5.1 Références',`<p>Une <b>référence</b> est une variable mutable : <code>ref v</code> a le type <code>'a ref</code>, défini par <code>type 'a ref = {mutable contents : 'a}</code>. On lit avec <code>!</code>, on modifie avec <code>:=</code>.</p>${c(`let p = ref 0;;
val p : int ref = {contents = 0}
!p;;  - : int = 0
p := !p + 1;;  - : unit = ()
p;;  - : int ref = {contents = 1}
!p;;  - : int = 1`)}${box('n','Deux égalités',`<p><code>=</code> (<b>logique</b>) compare le contenu ; <code>==</code> (<b>physique</b>) compare les adresses. Attention à ne pas utiliser <code>==</code> à la place de <code>=</code>.</p>${c(`let p1 = ref 5;; let p2 = ref 5;;

['5.2 Boucles',`<p><code>for i = a to b do &lt;expr&gt; done</code> exécute le corps <code>b − a + 1</code> fois (bornes <b>incluses</b>, contrairement à Python). <code>downto</code> décroît. <code>while &lt;test&gt; do &lt;expr&gt; done</code> boucle tant que le test est vrai : le test doit dépendre de valeurs mutables modifiées par le corps (références), sinon la boucle ne termine pas.</p>${c(`let somme n =
  let s = ref 0 in
  for i = 1 to n do s := !s + i done;
  !s;;

for i = 10 downto 0 do
  if i mod 2 = 0 then begin

  end
done;;

let pn n =   (* 1 + 0,5 + ... + 0,5^n *)
  let s = ref 0. in
  for i = 0 to n do s := !s +. 0.5 ** float_of_int i done;
  !s;;

let compte_vol u0 =   (* Syracuse : plus petit n tel que u_n = 1 *)
  assert (u0 > 0);
  let un = ref u0 and n = ref 0 in
  while !un > 1 do
    if !un mod 2 = 0 then un := !un / 2 else un := !un * 3 + 1;
    incr n

t1.(0);;  - : int = 1

t1.(3);;

m.(0).(0) <- 1;;
m;;  - : int array array = [|[|1; 0; 0|]; [|1; 0; 0|]|]   (* les deux lignes sont la même ! *)

  let m = Array.length tab and i = ref 0 in

return `<div class="ex"><b>Exercice ${k+1}</b> <span id="${id}_m">${DONE[id]?'✔':''}</span>${e[1]}`+(o?`<input id="${id}_i" placeholder="Ta réponse" onkeydown="if(event.key=='Enter')chk(${i},${k})">`:`<textarea id="${id}_i" rows="7" spellcheck="false">${esc(e[2])}</textarea>`)+`<p><button onclick="chk(${i},${k})">Vérifier</button>`+(o?'':`<button onclick="document.getElementById('${id}_i').value=EX[${i}][${k}][2]">Recommencer</button>`)+`</p><div id="${id}_f"></div><details><summary>Solution</summary>`+(o?`<p><code>${esc(e[2][0])}</code> — ${e[3]}</p>`:c(e[4]))+`</details></div>`}).join('');
function chk(i,k){const e=EX[i][k],id=`e${i}_${k}`,v=document.getElementById(id+'_i').value,f=document.getElementById(id+'_f');let er=[],ok;
if(e[0]=='o'){ok=e[2].some(a=>norm(a)==norm(v));f.innerHTML=ok?'✔ Correct. '+e[3]:'✘ Pas tout à fait : relis le code et réessaie.'}
else{if(v.trim()==e[2].trim())er.push("Complète d'abord le squelette.");
const n=r=>(v.match(r)||[]).length;
if(n(/\(/g)!=n(/\)/g))er.push('Parenthèses non équilibrées.');
if(n(/\bbegin\b/g)!=n(/\bend\b/g))er.push('<code>begin</code> et <code>end</code> non équilibrés.');
e[3].forEach(([r,m,x])=>{if(!!x==r.test(v))er.push(m)});
ok=!er.length;f.innerHTML=ok?"✔ La structure est correcte. Compare avec la solution : le site n'exécute pas ton code.":'✘ À revoir :<ul>'+er.map(m=>'<li>'+m+'</li>').join('')+'</ul>'}

f.className=ok?'good':'bad';
if(ok){DONE[id]=1;try{localStorage.setItem('done',JSON.stringify(DONE))}catch(x){}document.getElementById(id+'_m').textContent='✔'}}
const TOC=[['1 Variables',2,0,0,[['1.1 Portée',3,2],['1.2 Opérations sur les nombres',3,3],['1.3 Chaînes de caractères',5,4],['1.4 Opérateurs booléens',6,5]]],
['2 Fonctions',7,1,0,[['2.1 Fonctions de conversion',7,0],["2.2 Fonctions d'affichage",8,1],['2.3 Déclarer une fonction',9,2],['2.4 Fonctions locales',9,3],['2.5 Structures conditionnelles',10,4],['2.6 Polymorphisme paramétrique',11,5],["2.7 Fonctions d'ordre supérieur",11,6],['2.8 Pour aller plus loin : programmation purement fonctionnelle',13,7]]],
['3 Récursivité',14,2,0,[['3.1 Fonctions récursives',14,0],["3.2 L'arbre des appels récursifs",16,1],['3.3 Filtrage',17,2],['3.4 Récursivité croisée',18,3],['3.5 Une structure de données récursive : les listes chaînées',19,4],['3.6 Pour aller plus loin : la récursivité terminale',21,5]]],
['4 Des nouveaux types',22,3,0,[['4.1 Tuples',22,0],['4.2 Enregistrement',23,1],['4.3 Type somme',25,2],['4.4 Exceptions',26,3]]],
['5 Aspects impératifs',28,4,0,[['5.1 Références',28,0],['5.2 Boucles',29,1],['5.3 Tableaux',31,2]]],
['6 Modules',34,5,0,[]]];
const toc=()=>'<h1>Table des matières</h1><p>Clique sur une ligne pour aller à la section. Les numéros sont ceux des pages du cours imprimé.</p>'+TOC.map(([t,p,ch,s,u])=>`<a class="tl" href="#" onclick="show(${ch},${s});return false"><b>${t}</b><span>${p}</span></a>`+u.map(([n,g,q])=>`<a class="tl s" href="#" onclick="show(${ch},${q});return false">${n}<span>${g}</span></a>`).join('')).join('')+'<a class="tl" href="#" onclick="show(6);return false"><b>Fiche OCaml 1 : fonctions à connaître, compilation</b><span></span></a>';
function show(i,k){const t=T[i],ne=i>=0?EX[i]?EX[i].length:0:0;
let h='<h1>🐫 Cours OCaml</h1><p class="who">MP2I Fénelon Sainte-Marie<br>Amine IRAQI</p><button class="'+(i<0?'on':'')+'" onclick="show(-1)">📑 Table des matières</button>'+T.map((x,j)=>`<button class="${j==i?'on':''}" onclick="show(${j})">${x[0]}</button>`+(j==i?x[1].map((s,q)=>`<a href="#s${q}">${s[0]}</a>`).join('')+(ne?`<a href="#sx">Exercices (${EX[i].filter((_,q)=>DONE['e'+i+'_'+q]).length}/${ne})</a>`:''):'')).join('');
document.getElementById('nv').innerHTML=h;
document.getElementById('mn').innerHTML=i<0?toc():`<h1>${t[0]}</h1>`+t[1].map((s,q)=>`<section id="s${q}"><h2>${s[0]}</h2>${s[1]}</section>`).join('')+(ne?`<section id="sx"><h2>Exercices</h2><p>Saisis ta réponse puis clique sur « Vérifier ». Pour le code, la vérification porte sur la <b>structure</b> (le site n'exécute pas OCaml) : compare ensuite avec la solution.</p>${exs(i)}</section>`:'')+`<div class="pg">${i>0?`<button onclick="show(${i-1})">← ${T[i-1][0]}</button>`:'<span></span>'}${i<T.length-1?`<button onclick="show(${i+1})">${T[i+1][0]} →</button>`:''}</div>`;
if(k==null)window.scrollTo(0,0);else document.getElementById('s'+k).scrollIntoView();
try{localStorage.setItem('ch',i)}catch(e){}}
let s0=0;try{s0=+localStorage.getItem('ch')||0}catch(e){}
show(s0>=-1&&s0<T.length?s0:0);
</script></body></html>
